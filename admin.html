<style>

.card{

.card h3{

label{

input,
textarea,

.table-wrapper{

table{

th,

.modal{

    align-items:center;

.modal-box{

}

@media(max-width:700px){

}

</style>

<script>

const SUPABASE_URL =
"https://mitzxvmmnlkjczbmrumk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g6Nc_ma8cC3vsUDZZL-RJw_e4JbO6LF";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


let curriculum = [];
let articles = [];

let editingArticleId = null;

let selectedIssueId = null;


const curriculumList =
document.getElementById(
    "curriculumList"
);

const articlesTable =
document.getElementById(
    "articlesTable"
);

const articleIssue =
document.getElementById(
    "articleIssue"
);

const articleProblem =
document.getElementById(
    "articleProblem"
);

const message =
document.getElementById(
    "message"
);


function showMessage(
    text,
    type = "success"
){

    message.textContent =
        text;

    message.className =
        "message show " + type;

    setTimeout(
        function(){

            message.className =
                "message";

        },
        3000
    );

}


/* =========================
   التبويبات
========================= */

document
.querySelectorAll(".tab")
.forEach(
    function(tab){

        tab.addEventListener(
            "click",
            function(){

                document
                .querySelectorAll(".tab")
                .forEach(
                    function(t){

                        t.classList.remove(
                            "active"
                        );

                    }
                );

                document
                .querySelectorAll(".panel")
                .forEach(
                    function(p){

                        p.classList.remove(
                            "active"
                        );

                    }
                );

                tab.classList.add(
                    "active"
                );

                document
                .getElementById(
                    tab.dataset.panel
                )
                .classList.add(
                    "active"
                );

            }
        );

    }
);


/* =========================
   تحميل البرنامج من Supabase
========================= */

async function loadCurriculum(){

    curriculumList.innerHTML = `

        <div class="empty">
            جاري تحميل البرنامج...
        </div>

    `;

    const {
        data,
        error
    } =
        await supabaseClient
        .from("curriculum")
        .select("*")
        .order(
            "id",
            {
                ascending:true
            }
        );

    if(error){

        console.error(error);

        curriculumList.innerHTML = `

            <div class="empty">

                تعذر تحميل البرنامج.

                <br>

                <small>
                    ${error.message}
                </small>

            </div>

        `;

        showMessage(
            "تعذر تحميل البرنامج: " +
            error.message,
            "error"
        );

        return;

    }

    const rows =
        data || [];

    const grouped = {};

    rows.forEach(
        function(row){

            const key =
                row.issue_name;

            if(!grouped[key]){

                grouped[key] = {

                    id: row.id,

                    name:
                        row.issue_name,

                    subtitle:
                        row.issue_subtitle || "",

                    problems: []

                };

            }

            if(row.problem_name){

                grouped[key].problems.push({

                    id: row.id,

                    name:
                        row.problem_name

                });

            }

        }
    );

    curriculum =
        Object.values(grouped);

    renderCurriculum();

    populateIssueSelect();

}


/* =========================
   عرض البرنامج
========================= */

function renderCurriculum(){

    curriculumList.innerHTML = "";

    if(
        curriculum.length === 0
    ){

        curriculumList.innerHTML = `

            <div class="empty">

                لم تتم إضافة أي إشكالية بعد.

            </div>

        `;

        return;

    }

    curriculum.forEach(
        function(issue){

            const issueElement =
                document.createElement(
                    "div"
                );

            issueElement.className =
                "issue";


            const header =
                document.createElement(
                    "div"
                );

            header.className =
                "issue-header";


            const titleWrapper =
                document.createElement(
                    "div"
                );


            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "issue-name";

            title.textContent =
                issue.name;


            const subtitle =
                document.createElement(
                    "div"
                );

            subtitle.className =
                "issue-subtitle";

            subtitle.textContent =
                issue.subtitle || "";


            titleWrapper.appendChild(
                title
            );

            if(issue.subtitle){

                titleWrapper.appendChild(
                    subtitle
                );

            }


            const headerButtons =
                document.createElement(
                    "div"
                );

            headerButtons.className =
                "issue-actions";


            const addProblem =
                document.createElement(
                    "button"
                );

            addProblem.className =
                "btn btn-gold";

            addProblem.textContent =
                "+ إضافة مشكلة";


            addProblem.onclick =
                function(){

                    selectedIssueId =
                        issue.id;

                    document
                    .getElementById(
                        "problemName"
                    )
                    .value = "";

                    document
                    .getElementById(
                        "problemModal"
                    )
                    .classList.add(
                        "active"
                    );

                };


            const deleteIssue =
                document.createElement(
                    "button"
                );

            deleteIssue.className =
                "btn btn-red";

            deleteIssue.textContent =
                "حذف الإشكالية";


            deleteIssue.onclick =
                function(){

                    deleteIssue(
                        issue
                    );

                };


            headerButtons.appendChild(
                addProblem
            );

            headerButtons.appendChild(
                deleteIssue
            );


            header.appendChild(
                titleWrapper
            );

            header.appendChild(
                headerButtons
            );


            const problems =
                document.createElement(
                    "div"
                );

            problems.className =
                "problems";


            if(
                !issue.problems ||
                issue.problems.length === 0
            ){

                problems.innerHTML = `

                    <div class="empty">

                        لا توجد مشاكل داخل هذه الإشكالية.

                    </div>

                `;

            }


            (
                issue.problems || []
            )
            .forEach(
                function(problem){

                    const row =
                        document.createElement(
                            "div"
                        );

                    row.className =
                        "problem";


                    const name =
                        document.createElement(
                            "div"
                        );

                    name.className =
                        "problem-name";

                    name.textContent =
                        problem.name;


                    const deleteButton =
                        document.createElement(
                            "button"
                        );

                    deleteButton.className =
                        "btn btn-red";

                    deleteButton.textContent =
                        "حذف";


                    deleteButton.onclick =
                        function(){

                            deleteProblem(
                                problem
                            );

                        };


                    row.appendChild(
                        name
                    );

                    row.appendChild(
                        deleteButton
                    );

                    problems.appendChild(
                        row
                    );

                }
            );


            issueElement.appendChild(
                header
            );

            issueElement.appendChild(
                problems
            );

            curriculumList.appendChild(
                issueElement
            );

        }
    );

}


/* =========================
   إضافة إشكالية
========================= */

document
.getElementById(
    "addIssueButton"
)
.addEventListener(
    "click",
    addIssue
);


async function addIssue(){

    const name =
        document
        .getElementById(
            "issueName"
        )
        .value
        .trim();


    const subtitle =
        document
        .getElementById(
            "issueSubtitle"
        )
        .value
        .trim();


    if(!name){

        showMessage(
            "اكتب اسم الإشكالية أولًا.",
            "error"
        );

        return;

    }


    const existing =
        curriculum.some(
            function(issue){

                return (
                    issue.name.trim()
                    ===
                    name
                );

            }
        );


    if(existing){

        showMessage(
            "هذه الإشكالية موجودة بالفعل.",
            "error"
        );

        return;

    }


    /*
       نضيف الإشكالية
       مع مشكلة فارغة مؤقتًا.
       هذا يسمح لنا بإنشاء الإشكالية
       ثم إضافة مشاكل إليها.
    */

    const {
        error
    } =
        await supabaseClient

/* =========================
   إضافة مشكلة
========================= */

document

    "saveProblemButton"

    "click",
    addProblem

async function addProblem(){

    const name =
        document
        .getElementById(
            "problemName"
        )
        .value
        .trim();


    if(
        !name ||
        !selectedIssueId
    ){

        showMessage(
            "أدخل اسم المشكلة.",
            "error"
        );

        return;

    }


    const issue =
        curriculum.find(
            function(item){

                return (
                    item.id ===
                    selectedIssueId
                );

            }
        );


    if(!issue){

        showMessage(
            "تعذر تحديد الإشكالية.",
            "error"
        );

        return;

    }


    const alreadyExists =
        (
            issue.problems || []
        )
        .some(
            function(problem){

                return (
                    problem.name.trim()
                    ===
                    name
                );

            }
        );


    if(alreadyExists){

        showMessage(
            "هذه المشكلة موجودة بالفعل.",
            "error"
        );

        return;

    }


    /*
       إذا كانت الإشكالية الجديدة
       تحتوي على صف فارغ،
       نستعمله بدل إنشاء صف جديد.
    */

    let emptyRow = null;


    const {
        data:rows,
        error:findError
    } =
        await supabaseClient
        .from("curriculum")
        .select("*")
        .eq(
            "issue_name",
            issue.name
        )
        .eq(
            "problem_name",
            ""
        )
        .limit(1);


    if(findError){

        console.error(findError);

    }else if(
        rows &&
        rows.length
    ){

        emptyRow =
            rows[0];

    }


    let error;


    if(emptyRow){

        const result =
            await supabaseClient
            .from("curriculum")
            .update({

                problem_name:name

            })
            .eq(
                "id",
                emptyRow.id
            );

        error =
            result.error;

    }else{

        const result =
            await supabaseClient
            .from("curriculum")
            .insert({

                issue_name:
                    issue.name,

                issue_subtitle:
                    issue.subtitle || "",

                problem_name:name

            });

        error =
            result.error;

    }


    if(error){

        console.error(error);

        showMessage(
            "تعذر إضافة المشكلة: " +
            error.message,
            "error"
        );

        return;

    }


    document
    .getElementById(
        "problemName"
    )
    .value = "";


    document
    .getElementById(
        "problemModal"
    )
    .classList.remove(
        "active"
    );


    selectedIssueId =
        null;


    showMessage(
        "تمت إضافة المشكلة."
    );


    await loadCurriculum();

}

function updateProblemSelect(){

    `;


    const issueName =
        articleIssue.value;

/* =========================
   تحميل المقالات
========================= */

async function loadArticles(){

    articlesTable.innerHTML = `

        <tr>

            <td
                colspan="5"
                style="text-align:center;">

                جاري تحميل المقالات...

            </td>

        </tr>

    `;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("articles")
        .select("*")
        .order(
            "created_at",
            {
                ascending:false
            }
        );


    if(error){

        console.error(error);

        showMessage(
            "تعذر تحميل المقالات: " +
            error.message,
            "error"
        );

        return;

    }


    articles =
        data || [];


    renderArticles();

}


/* =========================
   عرض المقالات
========================= */

function renderArticles(){

    articlesTable.innerHTML = "";


    if(
        articles.length === 0
    ){

        articlesTable.innerHTML = `

            <tr>

                <td
                    colspan="5"
                    style="text-align:center;">

                    لا توجد مقالات.

                </td>

            </tr>

        `;

        return;

    }


    articles.forEach(
        function(article){

            const row =
                document.createElement(
                    "tr"
                );


            const title =
                document.createElement(
                    "td"
                );

            title.textContent =
                article.title ||
                "بدون عنوان";


            const issue =
                document.createElement(
                    "td"
                );

            issue.textContent =
                article.issue ||
                "-";


            const problem =
                document.createElement(
                    "td"
                );

            problem.textContent =
                article.problem ||
                "-";


            const status =
                document.createElement(
                    "td"
                );


            const statusSpan =
                document.createElement(
                    "span"
                );


            statusSpan.className =
                article.published
                ?
                "status status-published"
                :
                "status status-hidden";


            statusSpan.textContent =
                article.published
                ?
                "منشور"
                :
                "مخفي";


            status.appendChild(
                statusSpan
            );


            const actions =
                document.createElement(
                    "td"
                );


            const edit =
                document.createElement(
                    "button"
                );

            edit.className =
                "btn btn-dark";

            edit.textContent =
                "تعديل";


            edit.onclick =
                function(){

                    editArticle(
                        article
                    );

                };


            const toggle =
                document.createElement(
                    "button"
                );

            toggle.className =
                article.published
                ?
                "btn btn-dark"
                :
                "btn btn-green";


            toggle.textContent =
                article.published
                ?
                "إخفاء"
                :
                "نشر";


            toggle.onclick =
                function(){

                    togglePublished(
                        article
                    );

                };


            const remove =
                document.createElement(
                    "button"
                );

            remove.className =
                "btn btn-red";

            remove.textContent =
                "حذف";


            remove.onclick =
                function(){

                    deleteArticle(
                        article
                    );

                };


            actions.appendChild(
                edit
            );

            actions.appendChild(
                toggle
            );

            actions.appendChild(
                remove
            );


            row.appendChild(
                title
            );

            row.appendChild(
                issue
            );

            row.appendChild(
                problem
            );

            row.appendChild(
                status
            );

            row.appendChild(
                actions
            );


            articlesTable.appendChild(
                row
            );

        }
    );

}

function editArticle(article){

    .getElementById(

    .getElementById(
        "articleAuthor"
    )
    .value =
        article.author ||
        "الأستاذ زيد";


    document
    .getElementById(
        "articleExcerpt"
    )
    .value =
        article.excerpt || "";


    document
    .getElementById(
        "articleContent"
    )
    .value =

/* =========================
   حفظ المقال
========================= */

document
.getElementById(
    "saveArticleButton"
)
.addEventListener(
    "click",
    saveArticle
);


async function saveArticle(){

    const title =
        document
        .getElementById(
            "articleTitle"
        )
        .value
        .trim();


    const issue =
        articleIssue.value;


    const problem =
        articleProblem.value;


    const content =
        document
        .getElementById(
            "articleContent"
        )
        .value
        .trim();


    if(!title){

        showMessage(
            "أدخل عنوان المقال.",
            "error"
        );

        return;

    }


    if(!issue){

        showMessage(
            "اختر الإشكالية.",
            "error"
        );

        return;

    }


    if(!problem){

        showMessage(
            "اختر المشكلة.",
            "error"
        );

        return;

    }


    if(!content){

        showMessage(
            "أدخل محتوى المقال.",
            "error"
        );

        return;

    }


    const articleData = {

        title:title,

        issue:issue,

        problem:problem,

        content:content,

        excerpt:
            document
            .getElementById(
                "articleExcerpt"
            )
            .value
            .trim(),

        article_type:
            document
            .getElementById(
                "articleType"
            )
            .value
            .trim(),

        author:
            document
            .getElementById(
                "articleAuthor"
            )
            .value
            .trim(),

        published:
            document
            .getElementById(
                "articlePublished"
            )
            .value
            ===
            "true"

    };


    let result;


    if(editingArticleId){

        result =
            await supabaseClient
            .from("articles")
            .update(
                articleData
            )
            .eq(
                "id",
                editingArticleId
            );

    }else{

        result =
            await supabaseClient
            .from("articles")
            .insert(
                articleData
            );

    }


    if(result.error){

        console.error(
            result.error
        );

        showMessage(
            "حدث خطأ: " +
            result.error.message,
            "error"
        );

        return;

    }


    const wasEditing =
        Boolean(
            editingArticleId
        );


    showMessage(
        wasEditing
        ?
        "تم تعديل المقال."
        :
        "تمت إضافة المقال."
    );


    clearArticleForm();


    await loadArticles();

}

   إلغاء التعديل
========================= */

document
.getElementById(
    "cancelEditButton"
)
.addEventListener(

/* =========================

========================= */

async function deleteArticle(
    article
){

    const confirmed =
        confirm(

            "هل تريد حذف المقال:\n\n"
            +
            article.title
            +
            "\n\n"
            +
            "هذا الإجراء لا يمكن التراجع عنه."

    if(!confirmed){

    }


    const {
        error
    } =
        await supabaseClient
        .from("articles")
        .delete()
        .eq(
            "id",
            article.id
        );


    if(error){

        showMessage(
            "تعذر حذف المقال: " +
            error.message,
            "error"
        );

        return;

    }


    showMessage(
        "تم حذف المقال."
    );


    await loadArticles();

/* =========================
   نشر / إخفاء مقال
========================= */

async function togglePublished(
    article
){

    const {
        error
    } =
        await supabaseClient
        .from("articles")
        .update({

            published:
                !article.published

        })
        .eq(
            "id",
            article.id
        );


    if(error){

        showMessage(
            "تعذر تغيير حالة المقال.",
            "error"
        );

        return;

    }


    showMessage(

        article.published
        ?
        "تم إخفاء المقال."
        :
        "تم نشر المقال."

    );


    await loadArticles();

}


/* =========================
   بدء لوحة الإدارة
========================= */

async function start(){

    await loadCurriculum();

    await loadArticles();

}


start();
