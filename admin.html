<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>لوحة إدارة رواق زايد للفلسفة</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
    --bg:#080707;
    --bg2:#100e10;
    --card:#151215;
    --gold:#c5a059;
    --gold-light:#e5cf87;
    --white:#f4f1ea;
    --muted:#a39e93;
    --green:#5fcf91;
    --red:#d86b6b;
    --blue:#6da8e8;
    --border:rgba(197,160,89,.3);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    background:
        radial-gradient(circle at top,#171216,#080707 55%);
    color:var(--white);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
}

.header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(8,7,7,.94);
    backdrop-filter:blur(15px);
    border-bottom:1px solid var(--border);
}

.header-inner{
    width:min(1250px,94%);
    margin:auto;
    min-height:75px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:45px;
    height:45px;
    border:1px solid var(--gold);
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--gold-light);
    font-size:22px;
}

.brand h1{
    font-family:'Amiri',serif;
    color:var(--gold-light);
    font-size:1.5rem;
}

.brand span{
    display:block;
    color:var(--muted);
    font-size:.7rem;
}

.back-btn{
    text-decoration:none;
    color:var(--gold-light);
    border:1px solid var(--border);
    padding:8px 16px;
    border-radius:20px;
    font-size:.85rem;
}

.container{
    width:min(1250px,94%);
    margin:35px auto 70px;
}

.page-title{
    text-align:center;
    margin-bottom:35px;
}

.page-title h2{
    font-family:'Amiri',serif;
    color:var(--gold-light);
    font-size:2.5rem;
}

.page-title p{
    color:var(--muted);
    margin-top:5px;
}

.tabs{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:25px;
}

.tab{
    border:1px solid var(--border);
    background:#111;
    color:var(--muted);
    padding:10px 20px;
    border-radius:25px;
    cursor:pointer;
    font-family:inherit;
}

.tab.active{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#000;
    border-color:var(--gold-light);
}

.panel{
    display:none;
}

.panel.active{
    display:block;
}

.card{
    background:linear-gradient(145deg,rgba(25,22,25,.98),rgba(12,10,12,.98));
    border:1px solid var(--border);
    border-radius:12px;
    padding:25px;
    margin-bottom:25px;
}

.card h3{
    font-family:'Amiri',serif;
    color:var(--gold-light);
    font-size:1.6rem;
    margin-bottom:18px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:16px;
}

.full{
    grid-column:1/-1;
}

label{
    display:block;
    color:var(--muted);
    font-size:.82rem;
    margin-bottom:6px;
}

input,
textarea,
select{
    width:100%;
    background:#090809;
    color:var(--white);
    border:1px solid rgba(197,160,89,.28);
    border-radius:7px;
    padding:11px 13px;
    outline:none;
    font-family:inherit;
}

input:focus,
textarea:focus,
select:focus{
    border-color:var(--gold);
}

textarea{
    min-height:220px;
    resize:vertical;
}

.buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-top:18px;
}

button{
    font-family:inherit;
}

.btn{
    border:0;
    border-radius:7px;
    padding:9px 16px;
    cursor:pointer;
    font-weight:700;
}

.btn-gold{
    background:linear-gradient(135deg,var(--gold-light),var(--gold));
    color:#000;
}

.btn-dark{
    background:#1b181b;
    color:var(--white);
    border:1px solid var(--border);
}

.btn-red{
    background:rgba(216,107,107,.12);
    border:1px solid rgba(216,107,107,.45);
    color:#f18b8b;
}

.btn-green{
    background:rgba(95,207,145,.1);
    border:1px solid rgba(95,207,145,.4);
    color:#78e4a5;
}

.btn-blue{
    background:rgba(109,168,232,.1);
    border:1px solid rgba(109,168,232,.4);
    color:#8bbcf0;
}

/* PROGRAM */

.section-card{
    border:1px solid var(--border);
    border-radius:12px;
    margin-bottom:25px;
    overflow:hidden;
}

.section-header{
    padding:20px;
    background:linear-gradient(
        90deg,
        rgba(197,160,89,.15),
        transparent
    );
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
}

.section-title{
    font-family:'Amiri',serif;
    font-size:1.55rem;
    color:var(--gold-light);
}

.section-actions{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.semesters{
    padding:18px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
}

.semester{
    border:1px solid rgba(197,160,89,.2);
    border-radius:10px;
    overflow:hidden;
    background:rgba(10,9,10,.65);
}

.semester-header{
    padding:15px;
    background:rgba(197,160,89,.08);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
}

.semester-title{
    color:var(--gold-light);
    font-family:'Amiri',serif;
    font-size:1.25rem;
}

.issue-list{
    padding:12px;
}

.issue{
    border:1px solid rgba(197,160,89,.18);
    border-radius:8px;
    margin-bottom:10px;
    overflow:hidden;
}

.issue:last-child{
    margin-bottom:0;
}

.issue-header{
    padding:12px;
    background:rgba(197,160,89,.05);
}

.issue-name{
    color:#eee;
    font-weight:700;
}

.issue-subtitle{
    color:var(--muted);
    font-size:.72rem;
    margin-top:3px;
}

.issue-actions{
    display:flex;
    gap:6px;
    margin-top:10px;
    flex-wrap:wrap;
}

.problems{
    padding:10px;
}

.problem{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:9px;
    border-bottom:1px solid rgba(197,160,89,.08);
}

.problem:last-child{
    border-bottom:0;
}

.problem-name{
    color:#ccc;
    font-size:.8rem;
}

.empty{
    text-align:center;
    color:#777;
    padding:18px;
    font-size:.82rem;
}

/* ARTICLES */

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:13px;
    border-bottom:1px solid rgba(197,160,89,.12);
    text-align:right;
}

th{
    color:var(--gold-light);
    font-size:.85rem;
    background:#111;
}

td{
    color:#ddd;
    font-size:.82rem;
}

.status{
    padding:4px 10px;
    border-radius:20px;
    font-size:.7rem;
}

.status-published{
    color:#79e6a6;
    background:rgba(95,207,145,.1);
}

.status-hidden{
    color:#e78a8a;
    background:rgba(216,107,107,.1);
}

/* MESSAGE */

.message{
    position:fixed;
    left:20px;
    bottom:20px;
    z-index:9999;
    min-width:260px;
    max-width:90%;
    padding:13px 18px;
    border-radius:8px;
    background:#171417;
    border:1px solid var(--border);
    color:var(--white);
    box-shadow:0 15px 40px rgba(0,0,0,.5);
    display:none;
}

.message.show{
    display:block;
}

.message.success{
    border-color:rgba(95,207,145,.5);
}

.message.error{
    border-color:rgba(216,107,107,.5);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.85);
    backdrop-filter:blur(8px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:min(650px,100%);
    max-height:90vh;
    overflow:auto;
    background:#121012;
    border:1px solid var(--border);
    border-radius:12px;
    padding:25px;
}

.modal-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.modal-header h3{
    font-family:'Amiri',serif;
    color:var(--gold-light);
    font-size:1.5rem;
}

.close{
    width:38px;
    height:38px;
    border-radius:50%;
    border:1px solid var(--border);
    background:#090809;
    color:var(--gold-light);
    cursor:pointer;
    font-size:20px;
}

@media(max-width:850px){

    .semesters{
        grid-template-columns:1fr;
    }
}

@media(max-width:700px){

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .header-inner{
        min-height:65px;
    }

    .brand h1{
        font-size:1.15rem;
    }

    .page-title h2{
        font-size:2rem;
    }

    .section-header{
        align-items:flex-start;
        flex-direction:column;
    }
}
</style>
</head>

href="https://rewaqzaid.vercel.app/"

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://mitzxvmmnlkjczbmrumk.supabase.co";

const SUPABASE_KEY =
"sb_publishable_g6Nc_ma8cC3vsUDZZL-RJw_e4JbO6LF";

const supabaseClient =
window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   STATE
===================================================== */

let sections = [];
let issues = [];
let problems = [];
let articles = [];

let editingArticleId = null;


/* =====================================================
   ELEMENTS
===================================================== */

const programList =
document.getElementById("programList");

const articlesTable =
document.getElementById("articlesTable");

const articleSection =
document.getElementById("articleSection");

const articleSemester =
document.getElementById("articleSemester");

const articleIssue =
document.getElementById("articleIssue");

const articleProblem =
document.getElementById("articleProblem");

const modal =
document.getElementById("modal");

const modalTitle =
document.getElementById("modalTitle");

const modalContent =
document.getElementById("modalContent");

const message =
document.getElementById("message");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text,type="success"){

    message.textContent = text;

    message.className =
        "message show " + type;

    setTimeout(()=>{
        message.className="message";
    },3000);
}


/* =====================================================
   TABS
===================================================== */

document
.querySelectorAll(".tab")
.forEach(tab=>{

    tab.addEventListener("click",()=>{

        document
        .querySelectorAll(".tab")
        .forEach(t=>t.classList.remove("active"));

        document
        .querySelectorAll(".panel")
        .forEach(p=>p.classList.remove("active"));

        tab.classList.add("active");

        document
        .getElementById(tab.dataset.panel)
        .classList.add("active");

    });

});


/* =====================================================
   MODAL
===================================================== */

function openModal(title,content){

    modalTitle.textContent = title;

    modalContent.innerHTML = content;

    modal.classList.add("active");
}

function closeModal(){

    modal.classList.remove("active");

    modalContent.innerHTML="";
}

document
.getElementById("closeModal")
.addEventListener("click",closeModal);


/* =====================================================
   LOAD PROGRAM
===================================================== */

async function loadProgram(){

    const [
        sectionsResult,
        issuesResult,
        problemsResult
    ] = await Promise.all([

        supabaseClient
        .from("sections")
        .select("*")
        .order("sort_order")
        .order("created_at"),

        supabaseClient
        .from("issues")
        .select("*")
        .order("sort_order")
        .order("created_at"),

        supabaseClient
        .from("problems")
        .select("*")
        .order("sort_order")
        .order("created_at")

    ]);

    if(sectionsResult.error){
        showMessage(
            "خطأ في تحميل الشعب: "+
            sectionsResult.error.message,
            "error"
        );
        return;
    }

    if(issuesResult.error){
        showMessage(
            "خطأ في تحميل الإشكاليات: "+
            issuesResult.error.message,
            "error"
        );
        return;
    }

    if(problemsResult.error){
        showMessage(
            "خطأ في تحميل المشاكل: "+
            problemsResult.error.message,
            "error"
        );
        return;
    }

    sections = sectionsResult.data || [];
    issues = issuesResult.data || [];
    problems = problemsResult.data || [];

    renderProgram();

    populateArticleSections();
}


/* =====================================================
   RENDER PROGRAM
===================================================== */

function renderProgram(){

    programList.innerHTML="";

    if(!sections.length){

        programList.innerHTML=`
            <div class="empty">
                لا توجد شعب حتى الآن.
            </div>
        `;

        return;
    }


    sections.forEach(section=>{

        const sectionIssues =
            issues.filter(
                issue =>
                issue.section_id === section.id
            );


        const sectionCard =
            document.createElement("div");

        sectionCard.className =
            "section-card";


        const header =
            document.createElement("div");

        header.className =
            "section-header";


        header.innerHTML=`

            <div class="section-title">
                ${escapeHtml(section.name)}
            </div>

            <div class="section-actions">

                <button
                    class="btn btn-gold"
                    onclick="addIssue(${section.id})">
                    + إضافة إشكالية
                </button>

                <button
                    class="btn btn-dark"
                    onclick="editSection(${section.id})">
                    تعديل
                </button>

                <button
                    class="btn btn-red"
                    onclick="deleteSection(${section.id})">
                    حذف
                </button>

            </div>
        `;


        const semesters =
            document.createElement("div");

        semesters.className =
            "semesters";


        for(let semester=1;semester<=3;semester++){

            const semesterBox =
                document.createElement("div");

            semesterBox.className =
                "semester";


            const semesterIssues =
                sectionIssues.filter(
                    issue =>
                    Number(issue.sort_order) === semester
                );


            semesterBox.innerHTML=`

                <div class="semester-header">

                    <div class="semester-title">
                        الفصل ${semester}
                    </div>

                    <button
                        class="btn btn-gold"
                        onclick="addIssue(${section.id},${semester})">
                        +
                    </button>

                </div>

                <div class="issue-list"
                     id="issues-${section.id}-${semester}">
                </div>
            `;


            const issueList =
                semesterBox.querySelector(
                    ".issue-list"
                );


            if(!semesterIssues.length){

                issueList.innerHTML=`
                    <div class="empty">
                        لا توجد إشكاليات.
                    </div>
                `;

            }
            else{

                semesterIssues.forEach(issue=>{

                    const issueProblems =
                        problems.filter(
                            problem =>
                            problem.issue_id === issue.id
                        );


                    const issueBox =
                        document.createElement("div");

                    issueBox.className="issue";


                    issueBox.innerHTML=`

                        <div class="issue-header">

                            <div class="issue-name">
                                ${escapeHtml(issue.name)}
                            </div>

                            ${
                                issue.subtitle
                                ?
                                `<div class="issue-subtitle">
                                    ${escapeHtml(issue.subtitle)}
                                </div>`
                                :
                                ""
                            }

                            <div class="issue-actions">

                                <button
                                    class="btn btn-gold"
                                    onclick="addProblem(${issue.id})">
                                    + مشكلة
                                </button>

                                <button
                                    class="btn btn-dark"
                                    onclick="editIssue(${issue.id})">
                                    تعديل
                                </button>

                                <button
                                    class="btn btn-red"
                                    onclick="deleteIssue(${issue.id})">
                                    حذف
                                </button>

                            </div>

                        </div>

                        <div class="problems"></div>
                    `;


                    const problemBox =
                        issueBox.querySelector(".problems");


                    if(!issueProblems.length){

                        problemBox.innerHTML=`
                            <div class="empty">
                                لا توجد مشاكل.
                            </div>
                        `;

                    }
                    else{

                        issueProblems.forEach(problem=>{

                            const row =
                                document.createElement("div");

                            row.className="problem";


                            row.innerHTML=`

                                <div class="problem-name">
                                    ${escapeHtml(problem.name)}
                                </div>

                                <div>

                                    <button
                                        class="btn btn-dark"
                                        onclick="editProblem(${problem.id})">
                                        تعديل
                                    </button>

                                    <button
                                        class="btn btn-red"
                                        onclick="deleteProblem(${problem.id})">
                                        حذف
                                    </button>

                                </div>
                            `;


                            problemBox.appendChild(row);

                        });

                    }


                    issueList.appendChild(issueBox);

                });

            }


            semesters.appendChild(semesterBox);

        }


        sectionCard.appendChild(header);

        sectionCard.appendChild(semesters);

        programList.appendChild(sectionCard);

    });

}


/* =====================================================

===================================================== */

function escapeHtml(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function populateArticleSections(){

        `<option value="">اختر الشعبة</option>`;

    sections.forEach(section=>{

        const option =
            document.createElement("option");

        option.value=section.id;

        option.textContent=section.name;

        articleSection.appendChild(option);

    });

    populateArticleSemesters();

}

    populateArticleSemesters
);


articleSemester.addEventListener(
    "change",
    populateArticleIssues

);


function populateArticleSemesters(){

    articleSemester.innerHTML=`

        <option value="">
            اختر الفصل
        </option>

        <option value="1">
            الفصل الأول
        </option>

        <option value="2">

    articleIssue.innerHTML=

    articleProblem.innerHTML=

function populateArticleIssues(){

    articleIssue.innerHTML=
        `<option value="">اختر الإشكالية</option>`;

    articleProblem.innerHTML=
        `<option value="">اختر المشكلة</option>`;


    const sectionId =
        Number(articleSection.value);

        Number(articleSemester.value);


    if(!sectionId || !semester) return;


    issues
    .filter(
        issue =>
        issue.section_id===sectionId &&
        Number(issue.sort_order)===semester

    .forEach(issue=>{

        const option =
            document.createElement("option");

        option.value=issue.id;

        option.textContent=issue.name;

        articleIssue.appendChild(option);

    });

}


function populateArticleProblems(){

    articleProblem.innerHTML=

    const issueId =
        Number(articleIssue.value);

    if(!issueId) return;


    problems
    .filter(
        problem =>

        const option =
            document.createElement("option");

        option.value=problem.name;

        option.textContent=problem.name;

    });

/* =====================================================

async function loadArticles(){

    articlesTable.innerHTML=`

        <tr>
            <td colspan="7"
                style="text-align:center">
                جاري تحميل المقالات...
            </td>
        </tr>
    `;


    const {data,error} =
        await supabaseClient
        .from("articles")
        .select("*")
        .order("created_at",{ascending:false});


    if(error){

        showMessage(
            "تعذر تحميل المقالات: "+
            error.message,
            "error"
        );

        return;
    }


    articles=data || [];

    renderArticles();

}


function renderArticles(){

    articlesTable.innerHTML="";


    if(!articles.length){

        articlesTable.innerHTML=`

            <tr>
                <td colspan="7"
                    style="text-align:center">
                    لا توجد مقالات.
                </td>
            </tr>
        `;

        return;
    }


    articles.forEach(article=>{

        const row =
            document.createElement("tr");


        row.innerHTML=`

            <td>
                ${escapeHtml(article.title || "-")}
            </td>

            <td>
                ${escapeHtml(article.section || "-")}
            </td>

            <td>
                ${escapeHtml(article.semester || "-")}
            </td>

            <td>
                ${escapeHtml(article.issue || "-")}
            </td>

            <td>
                ${escapeHtml(article.problem || "-")}
            </td>

            <td>

                <span class="status ${
                    article.published
                    ?
                    "status-published"
                    :
                    "status-hidden"
                }">

                    ${
                        article.published
                        ?
                        "منشور"
                        :
                        "مخفي"
                    }

                </span>

            </td>

            <td>

                <button
                    class="btn btn-dark"
                    onclick="editArticle(${article.id})">
                    تعديل
                </button>

                <button
                    class="btn ${
                        article.published
                        ?
                        "btn-dark"
                        :
                        "btn-green"
                    }"
                    onclick="toggleArticle(${article.id})">

                    ${
                        article.published
                        ?
                        "إخفاء"
                        :
                        "نشر"
                    }

                </button>

                <button
                    class="btn btn-red"
                    onclick="deleteArticle(${article.id})">
                    حذف
                </button>

            </td>
        `;


        articlesTable.appendChild(row);

    });

}


/* =====================================================
   SAVE ARTICLE
===================================================== */

document
.getElementById("saveArticleButton")
.addEventListener("click",saveArticle);


async function saveArticle(){

    const title =
        document.getElementById("articleTitle")
        .value.trim();

    const sectionId =
        Number(articleSection.value);

    const semester =
        Number(articleSemester.value);

    const issueId =
        Number(articleIssue.value);

    const problem =
        articleProblem.value;

    const content =
        document.getElementById("articleContent")
        .value.trim();


    if(!title ||
       !sectionId ||
       !semester ||
       !issueId ||
       !problem ||
       !content){

        showMessage(
            "أكمل جميع بيانات المقال.",
            "error"
        );

        return;
    }


    const section =
        sections.find(s=>s.id===sectionId);

    const issue =
        issues.find(i=>i.id===issueId);


    const articleData={

        title:title,

        section:
            section
            ?
            section.name
            :
            "",

        semester:
            "الفصل " +
            (
                semester===1
                ?
                "الأول"
                :
                semester===2
                ?
                "الثاني"
                :
                "الثالث"
            ),

        issue:
            issue
            ?
            issue.name
            :
            "",

        problem:problem,

        content:content,

        excerpt:
            document
            .getElementById("articleExcerpt")
            .value.trim(),

        article_type:
            document
            .getElementById("articleType")
            .value.trim(),

        author:
            document
            .getElementById("articleAuthor")
            .value.trim(),

        published:
            document
            .getElementById("articlePublished")
            .value==="true"
    };


    let result;


    if(editingArticleId){

        result =
            await supabaseClient
            .from("articles")
            .update(articleData)
            .eq("id",editingArticleId);

    }
    else{

        result =
            await supabaseClient
            .from("articles")
            .insert(articleData);

    }


    if(result.error){

        showMessage(
            result.error.message,
            "error"
        );

        return;
    }


    showMessage(
        editingArticleId
        ?
        "تم تعديل المقال."
        :
        "تمت إضافة المقال."
    );


    clearArticleForm();

    await loadArticles();

}


/* =====================================================
   EDIT ARTICLE
===================================================== */

window.editArticle = function(id){

    const article =
        articles.find(a=>a.id===id);

    if(!article) return;


    editingArticleId=id;


    document
    .getElementById("articleFormTitle")
    .textContent="تعديل المقال";


    document
    .getElementById("articleTitle")
    .value=article.title || "";


    document
    .getElementById("articleType")
    .value=article.article_type || "مقال فلسفي";


    document
    .getElementById("articleAuthor")
    .value=article.author || "الأستاذ زيد";


    document
    .getElementById("articleExcerpt")
    .value=article.excerpt || "";


    document
    .getElementById("articleContent")
    .value=article.content || "";


    document
    .getElementById("articlePublished")
    .value=article.published
        ?
        "true"
        :
        "false";


    const section =
        sections.find(
            s=>s.name===article.section
        );


    if(section){

        articleSection.value=section.id;

        populateArticleSemesters();

        const semesterNumber =
            article.semester === "الفصل الأول"
            ?
            1
            :
            article.semester === "الفصل الثاني"
            ?
            2
            :
            3;


        articleSemester.value=
            semesterNumber;

        populateArticleIssues();


        const issue =
            issues.find(
                i =>
                i.section_id===section.id &&
                i.name===article.issue &&
                Number(i.sort_order)===semesterNumber
            );


        if(issue){

            articleIssue.value=issue.id;

            populateArticleProblems();

            articleProblem.value=
                article.problem || "";
        }

    }


    document
    .getElementById("cancelEditButton")
    .style.display="inline-block";


    document
    .querySelector('[data-panel="addArticlePanel"]')
    .click();

};

   CLEAR ARTICLE

function clearArticleForm(){

    editingArticleId=null;

    document
    .getElementById("articleFormTitle")
    .textContent="إضافة مقال جديد";

    document
    .getElementById("articleTitle")
    .value="";

    document
    .getElementById("articleType")
    .value="مقال فلسفي";

    document
    .getElementById("articleAuthor")
    .value="الأستاذ زيد";

    document
    .getElementById("articleExcerpt")
    .value="";

    document
    .getElementById("articleContent")
    .value="";

    document
    .getElementById("articlePublished")
    .value="true";

    articleSection.value="";

    populateArticleSemesters();

    document
    .getElementById("cancelEditButton")

}

/* =====================================================
   TOGGLE ARTICLE
===================================================== */

window.toggleArticle = async function(id){

    const article =
        articles.find(a=>a.id===id);

    if(!article) return;


    const {error} =
        await supabaseClient
        .from("articles")
        .update({
            published:!article.published
        })
        .eq("id",id);


    if(error){

        showMessage(
            error.message,
            "error"
        );

        return;
    }


    showMessage(
        article.published
        ?
        "تم إخفاء المقال."
        :
        "تم نشر المقال."
    );


    await loadArticles();

};
